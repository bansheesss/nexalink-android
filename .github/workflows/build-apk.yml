name: Build APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Fails (red) when the Python reference no longer produces the committed
  # golden vectors, i.e. the protocol changed and the Android app must follow.
  golden-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: bansheesss/remotelink-python
          ref: main
          path: _ref
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install cryptography==43.0.3
      - name: Regenerate vectors from the Python reference
        run: python tool/gen_golden.py --repo _ref --out /tmp/golden.json
      - name: Compare with committed vectors
        run: |
          diff -u test/vectors/golden.json /tmp/golden.json || {
            echo "::error::Python reference changed. Regenerate test/vectors/golden.json and update the Dart code."
            exit 1
          }

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.5"
          channel: stable
          cache: true

      - name: Create the Android platform folder if missing
        run: |
          if [ ! -d android ]; then
            cp -r lib /tmp/lib_bak && cp pubspec.yaml /tmp/pubspec_bak.yaml
            flutter create --platforms=android --org com.nexalink --project-name nexalink .
            rm -rf lib && cp -r /tmp/lib_bak lib && cp /tmp/pubspec_bak.yaml pubspec.yaml
            rm -f test/widget_test.dart
          fi
          python3 tool/patch_android.py

      - run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      # Protocol/security compatibility with the Python reference. If this
      # fails the APK is NOT built (on purpose).
      - name: Test (golden vectors from the Python reference)
        run: flutter test --reporter expanded

      - name: Build release APKs (one per ABI)
        run: flutter build apk --release --split-per-abi

      - name: Collect and rename APKs
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: *//; s/+.*//')
          mkdir -p dist
          for abi in arm64-v8a armeabi-v7a x86_64; do
            f="build/app/outputs/flutter-apk/app-$abi-release.apk"
            [ -f "$f" ] && cp "$f" "dist/nexalink-$VERSION-$abi-release.apk"
          done
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: nexalink-apk
          path: dist/*.apk
          if-no-files-found: error
